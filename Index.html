<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOME STORE - Modern E-Commerce Platform</title>
    <style>
        /* CSS Reset & Variables */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --primary: #0f172a;
            --primary-accent: #2563eb;
            --accent-hover: #1d4ed8;
            --bg-light: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger: #ef4444;
            --success: #10b981;
            --radius: 8px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Header Navigation */
        .top-nav {
            background-color: var(--primary);
            color: #ffffff;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .brand-logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mode-toggle-btn {
            background-color: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.5rem 1rem;
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .mode-toggle-btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .cart-icon-btn {
            position: relative;
            background: none;
            border: none;
            color: white;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 0.2rem;
        }

        .cart-badge {
            position: absolute;
            top: -6px;
            right: -10px;
            background-color: var(--danger);
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 999px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        /* Container Layouts */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem;
            width: 100%;
            flex: 1;
        }

        .page-view {
            display: none;
        }

        .page-view.active {
            display: block;
        }

        /* Customer Hero Banner */
        .hero-banner {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #ffffff;
            padding: 2.5rem 2rem;
            border-radius: var(--radius);
            margin-bottom: 2rem;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .hero-banner h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }

        .hero-banner p {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        /* Dynamic Category Tabs */
        .category-tabs {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 0.5rem 1.25rem;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.2s ease;
            color: var(--text-main);
        }

        .tab-btn:hover, .tab-btn.active {
            background-color: var(--primary-accent);
            color: #ffffff;
            border-color: var(--primary-accent);
        }

        /* Product Cards Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .product-img-wrapper {
            width: 100%;
            height: 220px;
            background-color: #f1f5f9;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .discount-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: var(--danger);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .stock-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .stock-badge.out {
            background-color: #64748b;
            color: white;
        }

        .product-info {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
            color: var(--text-main);
        }

        .product-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
        }

        .price-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 0.75rem;
        }

        .sale-price {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--primary);
        }

        .regular-price {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .product-options {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .product-select {
            flex: 1;
            padding: 0.4rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.85rem;
            background-color: #fff;
        }

        .card-actions {
            margin-top: auto;
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            padding: 0.6rem 1rem;
            border-radius: var(--radius);
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background-color 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary {
            background-color: var(--primary-accent);
            color: white;
            flex: 1;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: var(--text-main);
            flex: 1;
        }

        .btn-secondary:hover {
            background-color: #cbd5e1;
        }

        .btn-danger {
            background-color: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        .btn-sm {
            padding: 0.3rem 0.6rem;
            font-size: 0.8rem;
        }

        /* Cart Drawer Slide-out */
        .cart-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            z-index: 200;
            display: none;
        }

        .cart-overlay.active {
            display: block;
        }

        .cart-drawer {
            position: fixed;
            top: 0;
            right: -400px;
            width: 100%;
            max-width: 380px;
            height: 100vh;
            background: white;
            z-index: 201;
            box-shadow: -4px 0 15px rgba(0,0,0,0.1);
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .cart-drawer.active {
            right: 0;
        }

        .cart-header {
            padding: 1.25rem;
            background-color: var(--primary);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .cart-items-list {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .cart-item {
            display: flex;
            gap: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            align-items: center;
        }

        .cart-item-img {
            width: 60px;
            height: 60px;
            border-radius: 4px;
            object-fit: cover;
            background-color: #f1f5f9;
        }

        .cart-item-details {
            flex: 1;
        }

        .cart-item-title {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .cart-item-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .cart-item-price {
            font-weight: 700;
            color: var(--primary);
            margin-top: 2px;
        }

        .cart-footer {
            padding: 1.25rem;
            border-top: 1px solid var(--border-color);
            background-color: var(--bg-light);
        }

        .cart-total-row {
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 1rem;
        }

        /* Admin Layout Grid */
        .admin-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 900px) {
            .admin-grid {
                grid-template-columns: 380px 1fr;
            }
        }

        /* Form Styling */
        .admin-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
        }

        .admin-card h2 {
            font-size: 1.25rem;
            margin-bottom: 1.25rem;
            color: var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            color: var(--text-main);
        }

        .form-control {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary-accent);
        }

        .form-row {
            display: flex;
            gap: 0.75rem;
        }

        .form-row .form-group {
            flex: 1;
        }

        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-top: 0.5rem;
        }

        .tag-chip {
            background-color: #e2e8f0;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .tag-chip span {
            cursor: pointer;
            font-weight: bold;
            color: var(--danger);
        }

        /* Inventory Table */
        .table-controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .search-input {
            max-width: 300px;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        .data-table th, .data-table td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .data-table th {
            background-color: var(--bg-light);
            font-weight: 700;
            color: var(--text-muted);
        }

        .table-img {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            object-fit: cover;
            background-color: #f1f5f9;
        }

        .status-pill {
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: bold;
            display: inline-block;
            cursor: pointer;
        }

        .status-pill.instock {
            background-color: #d1fae5;
            color: #065f46;
        }

        .status-pill.outstock {
            background-color: #fee2e2;
            color: #991b1b;
        }

        /* Persistence Actions */
        .persistence-bar {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .hidden-file-input {
            display: none;
        }

        /* Responsive Utilities */
        @media (max-width: 600px) {
            .hero-banner h1 {
                font-size: 1.5rem;
            }
            .brand-logo {
                font-size: 1.1rem;
            }
            .mode-toggle-btn {
                padding: 0.4rem 0.6rem;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <!-- Top Sticky Header -->
    <header class="top-nav">
        <div class="brand-logo">
            <span>🏠 HOME STORE</span>
        </div>
        <div class="header-actions">
            <button class="mode-toggle-btn" id="modeToggleBtn" onclick="toggleViewMode()">
                ⚙️ Switch to Admin
            </button>
            <button class="cart-icon-btn" id="cartToggleBtn" onclick="toggleCartDrawer()">
                🛒 <span class="cart-badge" id="cartCount">0</span>
            </button>
        </div>
    </header>

    <div class="container">
        
        <!-- ================= CUSTOMER STOREFRONT VIEW ================= -->
        <main id="storefrontView" class="page-view active">
            <!-- Hero Banner -->
            <section class="hero-banner">
                <h1>Exclusive Collection</h1>
                <p>Discover high-quality apparel & modern essential goods.</p>
            </section>

            <!-- Dynamic Category Filter Tabs -->
            <nav class="category-tabs" id="categoryTabs">
                <!-- Dynamically populated JS -->
            </nav>

            <!-- Products Display Grid -->
            <section class="products-grid" id="storefrontProductsGrid">
                <!-- Dynamically populated JS -->
            </section>
        </main>


        <!-- ================= ADMIN DASHBOARD VIEW ================= -->
        <main id="adminView" class="page-view">
            <div class="admin-grid">
                
                <!-- Product Form (Add / Edit) -->
                <section class="admin-card">
                    <h2 id="formTitle">
                        <span>Add New Product</span>
                        <button type="button" class="btn btn-secondary btn-sm" id="cancelEditBtn" style="display:none;" onclick="resetForm()">Cancel Edit</button>
                    </h2>
                    <form id="productForm" onsubmit="handleFormSubmit(event)">
                        <input type="hidden" id="editProductId">

                        <div class="form-group">
                            <label class="form-label">Product Title *</label>
                            <input type="text" id="pTitle" class="form-control" placeholder="e.g. Oversized Heavyweight Hoodie" required>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Category *</label>
                                <select id="pCategorySelect" class="form-control" onchange="handleCategorySelectChange(this)" required>
                                    <option value="">Select Category</option>
                                    <option value="Hoodies">Hoodies</option>
                                    <option value="Cargos">Cargos</option>
                                    <option value="T-Shirts">T-Shirts</option>
                                    <option value="__NEW__">+ Custom Category</option>
                                </select>
                            </div>
                            <div class="form-group" id="customCategoryGroup" style="display: none;">
                                <label class="form-label">New Category Name</label>
                                <input type="text" id="pCategoryCustom" class="form-control" placeholder="e.g. Jackets">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Sale Price (₹) *</label>
                                <input type="number" id="pSalePrice" class="form-control" placeholder="1299" min="0" step="1" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Regular Price (₹) *</label>
                                <input type="number" id="pRegularPrice" class="form-control" placeholder="2499" min="0" step="1" required>
                            </div>
